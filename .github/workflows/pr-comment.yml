name: Agrega comentario a PR

on:
  workflow_run:
    workflows: ["TODO"]
    types: [completed]

permissions: {}

jobs:
  write-comment:
    runs-on: ubuntu-22.04
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: missing-entries
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: TODO
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! -f pr-number ]]; then
            echo 'TODO'
            exit 0
          fi
          pr="$(head -n1 pr-number)"
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo 'TODO'
            exit 1
          fi
          actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)"
          if [[ "actual_sha" != "$HEAD_SHA" ]]; then
            echo 'TODO'
            exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Agregar comentario con entradas faltantes
        if: steps.pr.outputs.pr != ''
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: comment.md
          pr-number: ${{ steps.pr.outputs.pr }}
          comment-tag: missing-entries
